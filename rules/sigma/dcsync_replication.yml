title: DCSync - Directory Replication by Non-DC Account
id: 6f1c2a4e-3b7d-4c51-9a0e-1d2f3a4b5c06
status: experimental
description: Detects directory replication rights used by an account that is not a domain controller (Mimikatz lsadump::dcsync, secretsdump).
author: Chayan Panchal
date: 2026/11/08
references:
  - https://attack.mitre.org/techniques/T1003/006/
tags:
  - attack.credential-access
  - attack.t1003.006
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    Properties|contains:
      - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
      - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
      - '89e95b76-444d-4c62-991a-0facbeda640c'
  filter_dc:
    SubjectUserName|endswith: '$'
  filter_aadconnect:
    SubjectUserName|startswith: 'MSOL_'
  condition: selection and not 1 of filter_*
falsepositives:
  - Azure AD Connect sync account (filtered)
level: critical
x_tuning: 'Excluded DC machine accounts and the Azure AD Connect (MSOL_) account'
